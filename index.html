<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLA 種畜等級與數據查詢系統 | Swine Grade & Breeding System</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #2563eb;
            --grade-a: #10b981;
            --grade-b: #f59e0b;
            --grade-c: #ef4444;
            --bg: #f8fafc;
        }
        body { background-color: var(--bg); color: #334155; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .navbar { background-color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card { border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 0.85rem; }
        .badge-grade-A { background-color: var(--grade-a); color: white; }
        .badge-grade-B { background-color: var(--grade-b); color: white; }
        .badge-grade-C { background-color: var(--grade-c); color: white; }
        .lang-sub { display: block; font-size: 0.72rem; color: #64748b; font-weight: 400; }
        
        /* 數值卡片樣式 */
        .metric-box {
            background: #f1f5f9;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .metric-label {
            font-size: 0.8rem;
            color: #64748b;
        }

        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .auth-card { width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 1rem; background: #ffffff; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body>

    <!-- 密碼驗證畫面 -->
    <div id="authOverlay">
        <div class="auth-card text-center">
            <div class="mb-3 text-primary"><i class="fas fa-user-lock fs-1"></i></div>
            <h4 class="fw-bold mb-1">系統授權訪問</h4>
            <div class="lang-sub mb-3">System Access Verification | Pengesahan Akses</div>
            <div class="mb-3 text-start">
                <input type="password" id="inputPassword" class="form-control form-control-lg text-center" placeholder="輸入密碼 / Password (yang)" autofocus>
                <div class="text-danger small mt-2 d-none" id="authErrorMsg">
                    <i class="fas fa-exclamation-circle me-1"></i>密碼錯誤！ / Kata laluan salah!
                </div>
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold" id="authSubmitBtn">確認進入 / Access</button>
        </div>
    </div>

    <!-- 主系統畫面 -->
    <div id="mainApp" style="display: none;">
        <nav class="navbar navbar-dark py-3 mb-4">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                    <i class="fas fa-dna me-2 text-warning fs-4"></i>
                    <div>
                        <div>GLA 種畜等級與數據查詢系統</div>
                        <div style="font-size: 0.75rem; opacity: 0.85;">Swine Grade & Breeding System | Sistem Gred Babi</div>
                    </div>
                </a>
                <div class="d-flex align-items-center">
                    <div class="navbar-text text-light small d-none d-md-block text-end me-3">
                        <div><i class="fas fa-circle text-warning me-1" id="statusDot"></i><span id="syncStatus">連線中...</span></div>
                    </div>
                    <button class="btn btn-sm btn-outline-light" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i>鎖定</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4 mb-5">
            
            <!-- 模式一：單隻個體耳號精準查詢與數值方框卡片 -->
            <div class="card p-4 mb-4 shadow-sm">
                <h5 class="fw-bold mb-3 text-primary"><i class="fas fa-search me-2"></i>個體耳號詳細數值查詢 (Individual Tag Search)</h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">公母選擇 / Category</label>
                        <select id="searchCategory" class="form-select form-select-lg">
                            <option value="sow">母豬 (Sow Grade)</option>
                            <option value="boar">公豬 (Boar Grade)</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">輸入耳號 / Enter Ear Tag</label>
                        <input type="text" id="searchTagInput" class="form-control form-control-lg" placeholder="請輸入完整或部分耳號 (例: Y1336, D1408)...">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary btn-lg w-100 fw-bold" id="executeSearchBtn">
                            <i class="fas fa-arrow-right me-1"></i> 查詢個體數值
                        </button>
                    </div>
                </div>

                <!-- 單隻個體詳細數值呈現卡片 (預設隱藏，點擊查詢後出現) -->
                <div id="individualResultContainer" class="mt-4 pt-3 border-top" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-dark mb-0">查詢結果數據卡片 (Profile Card)</h6>
                        <span id="resultBadge" class="badge px-3 py-2 fs-6">等級</span>
                    </div>
                    <div class="row g-3" id="metricBoxesRow">
                        <!-- 動態填入數值方框 -->
                    </div>
                </div>
            </div>

            <!-- 模式二：多條件篩選與整批資料下載區塊 -->
            <div class="card p-4 mb-4 bg-light">
                <h5 class="fw-bold mb-3 text-dark"><i class="fas fa-download me-2 text-success"></i>整批資料篩選與圖檔/報表下載 (Batch Filter & Download)</h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">等級篩選 / Grade</label>
                        <select id="filterGrade" class="form-select">
                            <option value="">全部等級 (All Grades)</option>
                            <option value="A">A 級 (Elite)</option>
                            <option value="B">B 級 (Multiplier)</option>
                            <option value="C">C 級 (Cull)</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold text-secondary">品種複選 (可勾選多個)</label>
                        <div class="d-flex gap-3 pt-2 bg-white p-2 rounded border">
                            <div class="form-check"><input class="form-check-input batch-chk" type="checkbox" value="L" id="chkL" checked><label class="form-check-label fw-bold" for="chkL">L (Landrace)</label></div>
                            <div class="form-check"><input class="form-check-input batch-chk" type="checkbox" value="Y" id="chkY" checked><label class="form-check-label fw-bold" for="chkY">Y (Yorkshire)</label></div>
                            <div class="form-check"><input class="form-check-input batch-chk" type="checkbox" value="D" id="chkD" checked><label class="form-check-label fw-bold" for="chkD">D (Duroc)</label></div>
                            <div class="form-check"><input class="form-check-input batch-chk" type="checkbox" value="LY" id="chkLY" checked><label class="form-check-label fw-bold" for="chkLY">LY (Cross)</label></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-success btn-lg w-100 fw-bold shadow-sm" id="downloadReportBtn">
                            <i class="fas file-download me-1"></i> 下載篩選後報表數據 (CSV)
                        </button>
                    </div>
                </div>
            </div>

            <!-- 查詢結果總表 -->
            <div class="card">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-list me-2 text-secondary"></i>試算表完整資料清單</h5>
                    <span class="badge bg-secondary" id="totalCount">0 筆</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>類別</th><th>等級</th><th>耳號</th><th>品系</th><th>關鍵數值 / 狀態</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <tr><td colspan="5" class="text-center py-4">資料載入中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SYSTEM_KEY = "yang";
        const API_URL = "https://script.google.com/macros/s/AKfycbzvpVM9rwy9eC3hUUiP7oIpYa_YNsotLJ5pW8A-c9jG_3eQ5BlLmeV9bQCkB-sH_c4wPA/exec";
        
        let rawSows = [];
        let rawBoars = [];

        function verifyPassword() {
            if (document.getElementById('inputPassword').value.trim() === SYSTEM_KEY) {
                sessionStorage.setItem("gla_auth", "ok");
                document.getElementById('authOverlay').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            } else {
                document.getElementById('authErrorMsg').classList.remove('d-none');
            }
        }

        document.getElementById('authSubmitBtn').addEventListener('click', verifyPassword);
        document.getElementById('inputPassword').addEventListener('keyup', e => { if (e.key === 'Enter') verifyPassword(); });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem("gla_auth");
            location.reload();
        });

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                rawSows = data.sows || [];
                rawBoars = data.boars || [];
                document.getElementById('syncStatus').innerText = "已連線即時資料庫";
                renderTable();
            } catch (e) {
                document.getElementById('syncStatus').innerText = "連線失敗";
            }
        }

        // 模式一：點選公母並輸入耳號，呈現數值方框卡片
        document.getElementById('executeSearchBtn').addEventListener('click', () => {
            const cat = document.getElementById('searchCategory').value;
            const tagQuery = document.getElementById('searchTagInput').value.trim().toLowerCase();
            const container = document.getElementById('individualResultContainer');
            const rowBox = document.getElementById('metricBoxesRow');
            const badge = document.getElementById('resultBadge');

            if (!tagQuery) {
                alert("請先輸入要查詢的耳號！");
                return;
            }

            container.style.display = "block";
            rowBox.innerHTML = "";

            if (cat === 'sow') {
                const found = rawSows.find(i => {
                    const t = String(i["母豬耳號"] || i["Ear Number"] || i["Tag ID"] || "").toLowerCase();
                    return t.includes(tagQuery);
                });

                if (!found) {
                    rowBox.innerHTML = `<div class="col-12 text-muted py-3">找不到此母豬耳號的資料。</div>`;
                    badge.className = "badge bg-secondary px-3 py-2 fs-6";
                    badge.innerText = "查無資料";
                    return;
                }

                const grade = (found["等級"] || found["Grade"] || "B").toUpperCase().charAt(0);
                badge.className = `badge badge-grade-${grade} px-3 py-2 fs-6`;
                badge.innerText = `${grade} 級母豬 (Sow)`;

                const tag = found["母豬耳號"] || found["Ear Number"] || "--";
                const breed = found["親代品系 1"] || found["Breed"] || "--";
                const parity = found["胎次"] || found["Parity"] || "--";
                const spi = found["計算 SPI"] || found["SPI"] || "--";
                const ggp = found["GGP選拔指數"] || found["GGP"] || "--";
                const psy = found["PSY (Pigs per sow per year每頭母豬每年離乳豬數 ("] || found["PSY"] || "--";

                rowBox.innerHTML = `
                    <div class="col-md-3"><div class="metric-box"><div class="metric-label">耳號 (Tag ID)</div><div class="metric-value text-primary">${tag}</div></div></div>
                    <div class="col-md-3"><div class="metric-box"><div class="metric-label">品種 (Breed)</div><div class="metric-value">${breed}</div></div></div>
                    <div class="col-md-3"><div class="metric-box"><div class="metric-label">胎次 (Parity)</div><div class="metric-value">第 ${parity} 胎</div></div></div>
                    <div class="col-md-3"><div class="metric-box"><div class="metric-label">計算 SPI</div><div class="metric-value text-success">${spi}</div></div></div>
                    <div class="col-md-6"><div class="metric-box"><div class="metric-label">GGP 選拔指數</div><div class="metric-value">${ggp}</div></div></div>
                    <div class="col-md-6"><div class="metric-box"><div class="metric-label">PSY (年離乳數)</div><div class="metric-value">${psy}</div></div></div>
                `;

            } else {
                const found = rawBoars.find(i => {
                    const t = String(i["Tag ID"] || i["Boar Ear Tag"] || "").toLowerCase();
                    return t.includes(tagQuery);
                });

                if (!found) {
                    rowBox.innerHTML = `<div class="col-12 text-muted py-3">找不到此公豬耳號的資料。</div>`;
                    badge.className = "badge bg-secondary px-3 py-2 fs-6";
                    badge.innerText = "查無資料";
                    return;
                }

                const grade = (found["Grade"] || found["等級"] || "B").toUpperCase().charAt(0);
                badge.className = `badge badge-grade-${grade} px-3 py-2 fs-6`;
                badge.innerText = `${grade} 級公豬 (Boar)`;

                const tag = found["Tag ID"] || found["Boar Ear Tag"] || "--";
                const breed = found["Breed"] || "--";
                const score = found["Score"] || "--";
                const strategy = found["Strategy"] || "--";
                const tso = found["TSO"] || "--";

                rowBox.innerHTML = `
                    <div class="col-md-4"><div class="metric-box"><div class="metric-label">公豬耳號 (Tag ID)</div><div class="metric-value text-primary">${tag}</div></div></div>
                    <div class="col-md-4"><div class="metric-box"><div class="metric-label">品種 (Breed)</div><div class="metric-value">${breed}</div></div></div>
                    <div class="col-md-4"><div class="metric-box"><div class="metric-label">策略 (Strategy)</div><div class="metric-value">${strategy}</div></div></div>
                    <div class="col-md-6"><div class="metric-box"><div class="metric-label">評分 (Score)</div><div class="metric-value text-success">${score}</div></div></div>
                    <div class="col-md-6"><div class="metric-box"><div class="metric-label">TSO 總精子量</div><div class="metric-value">${tso}</div></div></div>
                `;
            }
        });

        // 渲染下方總表
        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = "";
            
            let allRows = [];
            rawSows.forEach(i => allRows.push({ type: '母豬', item: i }));
            rawBoars.forEach(i => allRows.push({ type: '公豬', item: i }));

            document.getElementById('totalCount').innerText = allRows.length + " 筆";
            
            allRows.slice(0, 50).forEach(r => {
                const isSow = r.type === '母豬';
                const tag = isSow ? (r.item["母豬耳號"] || r.item["Ear Number"] || "--") : (r.item["Tag ID"] || r.item["Boar Ear Tag"] || "--");
                const breed = isSow ? (r.item["親代品系 1"] || r.item["Breed"] || "--") : (r.item["Breed"] || "--");
                const grade = (r.item["等級"] || r.item["Grade"] || "B").toUpperCase().charAt(0);
                const info = isSow ? `胎次: ${r.item["胎次"]||1} | SPI: ${r.item["計算 SPI"]||"--"}` : `評分: ${r.item["Score"]||"--"} | TSO: ${r.item["TSO"]||"--"}`;

                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-dark">${r.type}</span></td>
                        <td><span class="badge badge-grade-${grade}">${grade}</span></td>
                        <td class="fw-bold">${tag}</td>
                        <td>${breed}</td>
                        <td>${info}</td>
                    </tr>
                `;
            });
        }

        // 批次下載按鈕
        document.getElementById('downloadReportBtn').addEventListener('click', () => {
            const gradeFilter = document.getElementById('filterGrade').value.toUpperCase();
            const chkL = document.getElementById('chkL').checked;
            const chkY = document.getElementById('chkY').checked;
            const chkD = document.getElementById('chkD').checked;
            const chkLY = document.getElementById('chkLY').checked;

            let selectedBreeds = [];
            if (chkL) selectedBreeds.push('L');
            if (chkY) selectedBreeds.push('Y');
            if (chkD) selectedBreeds.push('D');
            if (chkLY) selectedBreeds.push('LY');

            let csvContent = "\uFEFF類別,等級,耳號,品種,詳細指標\n";

            rawSows.forEach(i => {
                const grade = (i["等級"] || i["Grade"] || "B").toUpperCase().charAt(0);
                const breed = String(i["親代品系 1"] || i["Breed"] || "").toUpperCase();
                const tag = i["母豬耳號"] || i["Ear Number"] || "";

                const matchGrade = !gradeFilter || grade === gradeFilter;
                const matchBreed = selectedBreeds.length === 0 || selectedBreeds.some(b => breed.includes(b));

                if (matchGrade && matchBreed) {
                    csvContent += `"母豬","${grade}","${tag}","${breed}","SPI: ${i["計算 SPI"]||""}"\n`;
                }
            });

            rawBoars.forEach(i => {
                const grade = (i["Grade"] || i["等級"] || "B").toUpperCase().charAt(0);
                const breed = String(i["Breed"] || "").toUpperCase();
                const tag = i["Tag ID"] || i["Boar Ear Tag"] || "";

                const matchGrade = !gradeFilter || grade === gradeFilter;
                const matchBreed = selectedBreeds.length === 0 || selectedBreeds.some(b => breed.includes(b));

                if (matchGrade && matchBreed) {
                    csvContent += `"公豬","${grade}","${tag}","${breed}","Score: ${i["Score"]||""}, TSO: ${i["TSO"]||""}"\n`;
                }
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `GLA_Breeding_Grade_Report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("gla_auth") === "ok") {
                document.getElementById('authOverlay').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            }
        });
    </script>
</body>
</html>
