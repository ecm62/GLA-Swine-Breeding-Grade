<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLA Swine Breeding & Selection System | 種畜評級與留種決策查詢系統</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #2563eb;
            --grade-a: #10b981;
            --grade-b: #f59e0b;
            --grade-c: #ef4444;
            --bg: #f8fafc;
        }
        body { background-color: var(--bg); color: #334155; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .navbar { background-color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card { border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 0.85rem; }
        .badge-grade-A { background-color: var(--grade-a); color: white; }
        .badge-grade-B { background-color: var(--grade-b); color: white; }
        .badge-grade-C { background-color: var(--grade-c); color: white; }
        .lang-sub { display: block; font-size: 0.72rem; color: #64748b; font-weight: 400; }
        .rule-card { background: #ffffff; border-left: 5px solid var(--accent); }
        .table thead th { font-size: 0.85rem; font-weight: 600; vertical-align: middle; background-color: #f1f5f9; }

        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .auth-card { width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 1rem; background: #ffffff; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body>

    <!-- 密碼驗證畫面 -->
    <div id="authOverlay">
        <div class="auth-card text-center">
            <div class="mb-3 text-primary"><i class="fas fa-user-lock fs-1"></i></div>
            <h4 class="fw-bold mb-1">系統授權訪問</h4>
            <div class="lang-sub mb-3">System Access Verification | Pengesahan Akses Sistem</div>
            <div class="mb-3 text-start">
                <input type="password" id="inputPassword" class="form-control form-control-lg text-center" placeholder="輸入密碼 / Password" autofocus>
                <div class="text-danger small mt-2 d-none" id="authErrorMsg">
                    <i class="fas fa-exclamation-circle me-1"></i>密碼錯誤！ / Kata laluan salah!
                </div>
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold" id="authSubmitBtn">確認進入 / Access</button>
        </div>
    </div>

    <!-- 主系統畫面 -->
    <div id="mainApp" style="display: none;">
        <nav class="navbar navbar-dark py-3 mb-4">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                    <i class="fas fa-dna me-2 text-warning fs-4"></i>
                    <div>
                        <div>GLA 種畜評級與留種決策查詢系統</div>
                        <div style="font-size: 0.75rem; opacity: 0.85;">Breeding & Selection Dashboard | Sistem Gred Babi</div>
                    </div>
                </a>
                <div class="d-flex align-items-center">
                    <div class="navbar-text text-light small d-none d-md-block text-end me-3">
                        <div><i class="fas fa-circle text-warning me-1" id="statusDot"></i><span id="syncStatus">連線中...</span></div>
                    </div>
                    <button class="btn btn-sm btn-outline-light" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i>鎖定</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4 mb-5">
            <!-- 搜尋與下載工具列 -->
            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="fas fa-filter me-2 text-primary"></i>篩選與資料下載專區 (Filter & Download Data)</h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">耳號查詢 / Tag Search</label>
                        <input type="text" id="queryTag" class="form-control" placeholder="輸入耳號...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary">公母分類 / Category</label>
                        <select id="queryCategory" class="form-select">
                            <option value="all">全部 (All)</option>
                            <option value="sow">母豬 (Sows)</option>
                            <option value="boar">公豬 (Boars)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary">等級篩選 / Grade</label>
                        <select id="queryGrade" class="form-select">
                            <option value="">全部等級 (All)</option>
                            <option value="A">A 級 (Elite)</option>
                            <option value="B">B 級 (Multiplier)</option>
                            <option value="C">C 級 (Cull)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">品系複選 (L / Y / D)</label>
                        <div class="d-flex gap-3 pt-1">
                            <div class="form-check"><input class="form-check-input breed-chk" type="checkbox" value="L" id="chkL" checked><label class="form-check-label" for="chkL">L</label></div>
                            <div class="form-check"><input class="form-check-input breed-chk" type="checkbox" value="Y" id="chkY" checked><label class="form-check-label" for="chkY">Y</label></div>
                            <div class="form-check"><input class="form-check-input breed-chk" type="checkbox" value="D" id="chkD" checked><label class="form-check-label" for="chkD">D</label></div>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-success w-100 py-2 fw-bold shadow-sm" id="downloadBtn">
                            <i class="fas fa-download me-1"></i> 下載篩選資料
                            <span class="d-block" style="font-size: 0.65rem;">Download Filtered CSV</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 表格清單區塊 -->
            <div class="row">
                <div class="col-12 mb-4" id="sowSection">
                    <div class="card">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-venus me-2 text-danger"></i>母豬清單 (Sow List)</h5>
                            <span class="badge bg-secondary" id="sowCount">0 筆</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-light">
                                    <tr>
                                        <th>等級</th><th>耳號</th><th>品系</th><th>胎次</th><th>SPI</th><th>留種判定建議</th>
                                    </tr>
                                </thead>
                                <tbody id="sowTableBody"><tr><td colspan="6" class="text-center py-4">載入中...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-12" id="boarSection">
                    <div class="card">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-mars me-2 text-primary"></i>公豬清單 (Boar List)</h5>
                            <span class="badge bg-secondary" id="boarCount">0 筆</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-light">
                                    <tr>
                                        <th>等級</th><th>耳號</th><th>品系</th><th>策略</th><th>TSO</th><th>操作指引</th>
                                    </tr>
                                </thead>
                                <tbody id="boarTableBody"><tr><td colspan="6" class="text-center py-4">載入中...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SYSTEM_KEY = "yang";
        const API_URL = "https://script.google.com/macros/s/AKfycbzvpVM9rwy9eC3hUUiP7oIpYa_YNsotLJ5pW8A-c9jG_3eQ5BlLmeV9bQCkB-sH_c4wPA/exec";
        
        let rawSows = [];
        let rawBoars = [];

        function verifyPassword() {
            if (document.getElementById('inputPassword').value.trim() === SYSTEM_KEY) {
                sessionStorage.setItem("gla_auth", "ok");
                document.getElementById('authOverlay').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            } else {
                document.getElementById('authErrorMsg').classList.remove('d-none');
            }
        }

        document.getElementById('authSubmitBtn').addEventListener('click', verifyPassword);
        document.getElementById('inputPassword').addEventListener('keyup', e => { if (e.key === 'Enter') verifyPassword(); });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem("gla_auth");
            location.reload();
        });

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                rawSows = data.sows || [];
                rawBoars = data.boars || [];
                document.getElementById('syncStatus').innerText = "已連線即時資料";
                filterAndRender();
            } catch (e) {
                document.getElementById('syncStatus').innerText = "連線失敗";
            }
        }

        function getSelectedBreeds() {
            let breeds = [];
            if (document.getElementById('chkL').checked) breeds.push('L');
            if (document.getElementById('chkY').checked) breeds.push('Y');
            if (document.getElementById('chkD').checked) breeds.push('D');
            return breeds;
        }

        function filterData() {
            const keyword = document.getElementById('queryTag').value.trim().toLowerCase();
            const grade = document.getElementById('queryGrade').value.toUpperCase();
            const selectedBreeds = getSelectedBreeds();

            const filteredSows = rawSows.filter(item => {
                const tag = String(item["母豬耳號"] || item["Ear Number"] || "").toLowerCase();
                const itemGrade = String(item["等級"] || item["Grade"] || "").toUpperCase();
                const breed = String(item["親代品系 1"] || item["Breed"] || "").toUpperCase();
                
                const matchTag = !keyword || tag.includes(keyword);
                const matchGrade = !grade || itemGrade.startsWith(grade);
                const matchBreed = selectedBreeds.length === 0 || selectedBreeds.some(b => breed.includes(b));
                return matchTag && matchGrade && matchBreed;
            });

            const filteredBoars = rawBoars.filter(item => {
                const tag = String(item["Tag ID"] || item["Boar Ear Tag"] || "").toLowerCase();
                const itemGrade = String(item["Grade"] || item["等級"] || "").toUpperCase();
                const breed = String(item["Breed"] || "").toUpperCase();
                
                const matchTag = !keyword || tag.includes(keyword);
                const matchGrade = !grade || itemGrade.startsWith(grade);
                const matchBreed = selectedBreeds.length === 0 || selectedBreeds.some(b => breed.includes(b));
                return matchTag && matchGrade && matchBreed;
            });

            return { filteredSows, filteredBoars };
        }

        function filterAndRender() {
            const { filteredSows, filteredBoars } = filterData();
            const category = document.getElementById('queryCategory').value;

            // 渲染母豬
            const sowTbody = document.getElementById('sowTableBody');
            sowTbody.innerHTML = "";
            document.getElementById('sowCount').innerText = filteredSows.length + " 筆";
            filteredSows.forEach(item => {
                const tag = item["母豬耳號"] || item["Ear Number"] || "--";
                const breed = item["親代品系 1"] || item["Breed"] || "--";
                const grade = (item["等級"] || item["Grade"] || "B").toUpperCase().charAt(0);
                const parity = item["胎次"] || item["Parity"] || 1;
                const spi = item["計算 SPI"] || item["SPI"] || "--";
                sowTbody.innerHTML += `<tr><td><span class="badge badge-grade-${grade}">${grade}</span></td><td><b>${tag}</b></td><td>${breed}</td><td>第 ${parity} 胎</td><td>${spi}</td><td>-</td></tr>`;
            });

            // 渲染公豬
            const boarTbody = document.getElementById('boarTableBody');
            boarTbody.innerHTML = "";
            document.getElementById('boarCount').innerText = filteredBoars.length + " 筆";
            filteredBoars.forEach(item => {
                const tag = item["Tag ID"] || item["Boar Ear Tag"] || "--";
                const breed = item["Breed"] || "--";
                const grade = (item["Grade"] || item["等級"] || "B").toUpperCase().charAt(0);
                const strategy = item["Strategy"] || "--";
                const tso = item["TSO"] || "--";
                boarTbody.innerHTML += `<tr><td><span class="badge badge-grade-${grade}">${grade}</span></td><td><b>${tag}</b></td><td>${breed}</td><td>${strategy}</td><td>${tso}</td><td>-</td></tr>`;
            });

            document.getElementById('sowSection').style.display = (category === 'boar') ? 'none' : 'block';
            document.getElementById('boarSection').style.display = (category === 'sow') ? 'none' : 'block';
        }

        // 一鍵下載篩選後資料為 CSV 檔案
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const { filteredSows, filteredBoars } = filterData();
            let csvContent = "\uFEFF"; // UTF-8 BOM 確保 Excel 開啟中文不亂碼
            
            csvContent += "=== 母豬清單 (Sow List) ===\n";
            csvContent += "等級,耳號,品系,胎次,SPI\n";
            filteredSows.forEach(i => {
                csvContent += `"${i["等級"]||i["Grade"]||""}","${i["母豬耳號"]||i["Ear Number"]||""}","${i["親代品系 1"]||i["Breed"]||""}","${i["胎次"]||i["Parity"]||""}","${i["計算 SPI"]||i["SPI"]||""}"\n`;
            });

            csvContent += "\n=== 公豬清單 (Boar List) ===\n";
            csvContent += "等級,耳號,品系,策略,TSO\n";
            filteredBoars.forEach(i => {
                csvContent += `"${i["Grade"]||i["等級"]||""}","${i["Tag ID"]||i["Boar Ear Tag"]||""}","${i["Breed"]||""}","${i["Strategy"]||""}","${i["TSO"]||""}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `GLA_Swine_Report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById('queryTag').addEventListener('input', filterAndRender);
        document.getElementById('queryCategory').addEventListener('change', filterAndRender);
        document.getElementById('queryGrade').addEventListener('change', filterAndRender);
        document.querySelectorAll('.breed-chk').forEach(chk => chk.addEventListener('change', filterAndRender));

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("gla_auth") === "ok") {
                document.getElementById('authOverlay').style.display = "none";
                document.getElementById('mainApp').style.display = "block";
                loadData();
            }
        });
    </script>
</body>
</html>
